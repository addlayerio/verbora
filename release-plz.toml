# Each public Verbora crate has its own version. release-plz prepares a release
# only for crates affected by the merged changes, then publishes crates whose
# versioned Release PR has been reviewed and merged into `main`.

[workspace]
changelog_update = false
publish_all_features = true
publish_timeout = "30m"

# Documentation examples are a workspace test harness, not a public crate.
[[package]]
name = "verbora-examples"
release = false
publish = false
