# The five documentation gates, and the Pages publication they guard.
#
# `AGENTS.md` § "The five gates" describes this file as enforcing:
#
#   1. every published Rust snippet compiles AND its assertions pass
#   2. cargo test --workspace (unit + integration + doctests)
#   3. cargo doc with -D warnings and -D rustdoc::broken_intra_doc_links
#   4. npx vitepress build (a sidebar entry with no page behind it fails)
#   5. internal link and anchor check, including inside raw HTML, plus a check
#      that every page is reachable from the sidebar
#
# Gates 1, 2 and 3 had never run anywhere: this workflow did not exist, and the
# workflow that did (`site.yml`, now folded into this one) ran only 4 and 5.
# The snippet gate is described as authoritative in `README.md:41`,
# `AGENTS.md:2806`, `CONTRIBUTING.md:45`, `DOCUMENTATION.md:28`,
# `site/reference/docs-are-code.md:10`, `site/package.json:11`,
# `docs/design/rust-native-migration.md:147`,
# `docs/design/text-shaping-contract.md:934` and
# `docs/design/distance-contract.md:1342` — and no CI job invoked it, which is
# how 92 broken published snippets accumulated without a single red build.
#
# Every gate here FAILS the build. A step that reports and continues is not a
# gate, so nothing below is `continue-on-error`, and `deploy` needs all of them.
#
# NOTE: no benchmark runs here, deliberately. `CLAUDE.md` forbids it — a
# competitive campaign takes hours, and CI is not where it is spent. Making a
# bench target *compile* is `cargo check --all-targets`'s job (ci.yml), not
# `cargo bench`'s.
#
# One-time repository setup: Settings → Pages → "Build and deployment" →
# Source = "GitHub Actions". Without that, the deploy job fails with a
# "Pages site not found" style error; nothing in this file can set it.
name: docs

# The two path lists below are identical and must stay that way. They are
# written out twice because GitHub Actions' workflow parser does not support
# YAML anchors and aliases.
#
# `crates/**` is in them because the snippets are compiled and RUN against
# those crates: a source change can break a published example without touching
# site/ at all, which is exactly the hole a site-only filter leaves open.
on:
  push:
    branches: [main, master]
    paths:
      - 'site/**'
      - 'crates/**'
      - 'Cargo.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'crates/**'
      - 'Cargo.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race. `cancel-in-progress: false` because a half-run
# deployment left cancelled is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate 1. Extracts every ```rust block on the site into a generated example
  # under crates/verbora-examples/examples/ and runs it, so a wrong assert_eq!
  # on a published page fails exactly like a wrong test.
  snippets:
    name: 'Gate 1 — published snippets compile and pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The generated file is .gitignore'd and written fresh on every run. A
      # checkout that already contains one means someone committed it, and the
      # snippets that would then be compiled are not the ones on the site.
      - name: Refuse a committed copy of the generated example
        run: |
          if [ -e crates/verbora-examples/examples/doc_snippets.rs ]; then
            echo "::error::crates/verbora-examples/examples/doc_snippets.rs is committed."
            echo "It is generated by site/check-snippets.py and .gitignore'd; remove it."
            exit 1
          fi

      - name: Compile and run every published snippet
        run: python3 site/check-snippets.py

      # check-snippets.py deletes the generated file unless --keep. Asserting
      # that here keeps a future change to its cleanup from quietly leaving
      # build output in the source tree.
      - name: The generated example was cleaned up
        run: test ! -e crates/verbora-examples/examples/doc_snippets.rs

  # Gates 2 and 3. The published API has to exist and its rustdoc links have to
  # resolve before a site describing them is deployed.
  #
  # Gate 2 overlaps ci.yml's `features` job on --all-features. Kept anyway: this
  # is what blocks a *publication*, and a deploy that depends on a green run in
  # some other workflow is not a dependency GitHub Actions can express.
  rust:
    name: 'Gates 2 and 3 — workspace tests and rustdoc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Workspace tests (unit, integration, doctests)
        run: cargo test --workspace --all-features

      - name: Rustdoc, warnings and broken intra-doc links denied
        env:
          RUSTDOCFLAGS: '-D warnings -D rustdoc::broken_intra_doc_links'
        run: cargo doc --workspace --all-features --no-deps

  # Gates 4 and 5, plus the artifact the deploy job publishes. check-links.py
  # validates the *rendered* output that is about to be uploaded: every internal
  # link, every #anchor, every page reachable from the sidebar. No network
  # access — external links are deliberately not fetched.
  site:
    name: 'Gates 4 and 5 — site build and internal links'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          # config.ts sets `lastUpdated: true`, and VitePress reads that
          # timestamp from git history. A shallow clone would stamp every page
          # with the same commit date.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check internal links and anchors
        run: python3 check-links.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    name: Publish to GitHub Pages
    needs: [snippets, rust, site]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A job-level `permissions` block replaces the workflow-level one rather
    # than adding to it, so `contents: read` is restated here.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
