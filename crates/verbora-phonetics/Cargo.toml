[package]
name = "verbora-phonetics"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Phonetic encoders (Soundex, Metaphone, Double Metaphone, NYSIIS, Caverphone, Cologne, Daitch-Mokotoff, Beider-Morse) for Rust"
keywords = ["soundex", "metaphone", "phonetics"]
categories.workspace = true

# docs.rs bakes one immutable page set per published version: a page built with
# the wrong flags cannot be re-rendered later, only republished under a new
# version. Build with every feature enabled, so feature-gated items and the doc
# links pointing at them resolve, and with `--cfg docsrs`, which is what makes
# the `#[cfg_attr(docsrs, doc(cfg(...)))]` feature badges render.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
verbora-core = { workspace = true }
verbora-tokenizers = { workspace = true }
rayon = { workspace = true, optional = true }
# Beider-Morse's rule contexts are genuine regexes, written as such in the
# rule corpus itself -- see `src/beider_morse/rule.rs`. Already a workspace
# dependency, not a new dependency category.
regex = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# Enables `par_encode_batch` / `par_encode_double_batch`, chunked batch
# encoding over `rayon`. See `src/parallel.rs` for why this is opt-in and why
# it is chunked rather than one Rayon task per word.
parallel = ["dep:rayon"]

[[bench]]
name = "phonetics"
harness = false

[[bench]]
name = "phonetic_index"
harness = false

[[bench]]
name = "beider_morse"
harness = false

[lints]
workspace = true
