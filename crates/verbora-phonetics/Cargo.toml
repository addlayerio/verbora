[package]
name = "verbora-phonetics"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Phonetic encoders (Soundex, Metaphone, Double Metaphone, NYSIIS, Caverphone, Cologne, Daitch-Mokotoff, Beider-Morse) for Rust"
keywords = ["soundex", "metaphone", "phonetics"]
categories.workspace = true

[dependencies]
verbora-core = { workspace = true }
verbora-tokenizers = { workspace = true }
rayon = { workspace = true, optional = true }
# Beider-Morse's rule contexts are genuine regexes, written as such in the
# rule corpus itself -- see `src/beider_morse/rule.rs`. Already a workspace
# dependency, not a new dependency category.
regex = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# Enables `par_encode_batch` / `par_encode_double_batch`, chunked batch
# encoding over `rayon`. See `src/parallel.rs` for why this is opt-in and why
# it is chunked rather than one Rayon task per word.
parallel = ["dep:rayon"]

[[bench]]
name = "phonetics"
harness = false

[[bench]]
name = "phonetic_index"
harness = false

[[bench]]
name = "beider_morse"
harness = false

[lints]
workspace = true
