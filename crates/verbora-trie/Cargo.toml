[package]
name = "verbora-trie"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Arena-backed prefix trie for Rust"
keywords = ["trie", "prefix-tree"]
categories.workspace = true

# docs.rs bakes one immutable page set per published version: a page built with
# the wrong flags cannot be re-rendered later, only republished under a new
# version. Build with every feature enabled, so feature-gated items and the doc
# links pointing at them resolve, and with `--cfg docsrs`, which is what makes
# the `#[cfg_attr(docsrs, doc(cfg(...)))]` feature badges render.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Child lists are one or two entries for the overwhelming majority of nodes;
# inline storage keeps a bulk load from making one heap allocation per node.
smallvec = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }
# Benchmarks only: the hash-map-per-node baseline the arena is measured against
# is given the fastest hasher available, so the comparison is not won by SipHash.
rustc-hash = { workspace = true }

[[bench]]
name = "trie"
harness = false

[lints]
workspace = true
