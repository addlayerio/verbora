[package]
name = "verbora-wordnet"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "WordNet lexical database access for Rust"
keywords = ["wordnet", "lexical", "nlp"]
categories.workspace = true
# The WordNet database itself is NOT distributed with this crate; it is read at
# run time from a directory the caller supplies. See LICENSE-WORDNET.
include = ["src/**", "benches/**", "tests/**", "LICENSE-WORDNET", "README.md"]

[dependencies]
# Newline scanning: line-start tables, the backwards scan to a line start, and
# the forward read to the end of a line.
memchr = { workspace = true }
# `WordNet::closure`'s visited set, keyed on (category, offset). A hyponym
# closure can reach tens of thousands of synsets, so the linear scan a `Vec`
# would need is quadratic; the keys come from the caller's own dictionary, not
# from untrusted input, so SipHash's DoS resistance buys nothing here.
rustc-hash = { workspace = true }
# `par_lookup_batch`: data-parallel fan-out over `WordNet::lookup`, gated
# behind the `parallel` feature. See `WordNet::par_lookup_batch`'s docs.
rayon = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[features]
default = []
# Adds `WordNet::par_lookup_batch`, a `rayon`-backed fan-out over the existing
# sequential `WordNet::lookup`. See its doc comment in `src/wordnet.rs` for
# when to reach for it.
parallel = ["dep:rayon"]

[[bench]]
name = "wordnet"
harness = false

[lints]
workspace = true
