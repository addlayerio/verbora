[package]
name = "verbora-spellcheck"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Norvig-style spelling correction for Rust"
keywords = ["spellcheck", "levenshtein"]
categories.workspace = true

[dependencies]
# The one metric this crate measures with: unrestricted Damerau–Levenshtein
# over Unicode scalars. Both indexes and `Spellcheck` verify candidates with
# it, and generation uses the same unit -- see `src/deletions.rs`.
verbora-distance = { workspace = true }
# Deletion-sequence retrieval hashes short scalar sequences and small integer
# keys, where SipHash's DoS resistance buys nothing: the keys come from the
# caller's own corpus, not from untrusted network input.
rustc-hash = { workspace = true }
# `par_corrections_batch`: data-parallel fan-out over
# `Spellcheck::corrections`, gated behind the `parallel` feature. See that
# method's docs in `src/spellcheck.rs` for when to reach for it.
rayon = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# Adds `Spellcheck::par_corrections_batch`, a `rayon`-backed fan-out over the
# existing sequential `Spellcheck::corrections`. Every call is independent
# against one shared, read-only `Spellcheck`, which is the shape a `rayon`
# fan-out is for: a distance >= 3 query scans the corpus, and even indexed
# distance <= 2 calls add up over document-sized batches.
parallel = ["dep:rayon"]

[[bench]]
name = "spellcheck"
harness = false

[[bench]]
name = "fuzzy_index"
harness = false

[[bench]]
name = "deletion_index"
harness = false

[lints]
workspace = true
