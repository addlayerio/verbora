[package]
name = "verbora-ngrams"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "N-gram windows over sequences and Unicode scalars"
keywords = ["ngram", "bigram", "trigram"]
categories.workspace = true

# docs.rs bakes one immutable page set per published version: a page built with
# the wrong flags cannot be re-rendered later, only republished under a new
# version. Build with every feature enabled, so feature-gated items and the doc
# links pointing at them resolve, and with `--cfg docsrs`, which is what makes
# the `#[cfg_attr(docsrs, doc(cfg(...)))]` feature badges render.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# No dependencies. The crate is `slice::windows` with a precondition the type
# system discharges, one padding rule, and one character-window iterator.
[dependencies]

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "ngrams"
harness = false

[lints]
workspace = true
