[package]
name = "verbora-analyzers"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Rule-based clause analysis over POS-tagged English sentences"
keywords = ["nlp", "sentence", "analysis", "syntax", "pos"]
categories.workspace = true

# docs.rs bakes one immutable page set per published version: a page built with
# the wrong flags cannot be re-rendered later, only republished under a new
# version. Build with every feature enabled, so feature-gated items and the doc
# links pointing at them resolve, and with `--cfg docsrs`, which is what makes
# the `#[cfg_attr(docsrs, doc(cfg(...)))]` feature badges render.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Deliberately no `verbora-core`: this crate never tokenizes, splits on
# whitespace, or looks inside a token. Its input unit is the tagged word, which
# the caller supplies already formed, so none of `verbora-core`'s traits or
# helpers applies here.
#
# `par_analyze_batch`: data-parallel fan-out over the per-sentence `analyze`
# pipeline, gated behind the `parallel` feature. See `par_analyze_batch`'s own
# documentation for when to reach for it.
rayon = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# Adds `par_analyze_batch`, a `rayon`-backed fan-out that calls the sequential
# `analyze` once per sentence. See its own documentation for when to reach for
# it.
parallel = ["dep:rayon"]

[[bench]]
name = "analyzers"
harness = false

[lints]
workspace = true
