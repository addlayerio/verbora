[package]
name = "verbora-classifiers"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Bayes, logistic regression and maximum entropy text classifiers for Rust"
keywords = ["classifier", "bayes", "maxent", "machine-learning"]
categories.workspace = true

[dependencies]
# Deliberately no `verbora-core`: the one item this crate used from it — the
# whitespace class a class label is trimmed against and a Brown corpus is split
# on — now lives in `src/whitespace.rs`, because this crate was its only caller.
# `tokenize_and_stem`, the classifiers' only contact with the rest of the
# library — and how they inherit the process-global stop-word list. Its
# behaviour is fingerprinted into every saved model; see `src/stamp.rs`.
verbora-stemmers = { workspace = true }
# `unicode_version`, stamped into every saved model so one trained under a
# different set of word boundaries is refused rather than silently mispredicting.
# See `src/stamp.rs`.
verbora-tokenizers = { workspace = true }
rustc-hash = { workspace = true }
# `par_classify_batch`: data-parallel fan-out over `Classifier::classify`,
# gated behind the `parallel` feature. See its doc comment in
# `src/basic/classifier.rs` for when to reach for it.
rayon = { workspace = true, optional = true }

# Deliberately no `serde_json`: this crate needs a JSON reader whose float
# parsing is correctly rounded and whose objects keep document order, and
# `serde_json` (without `preserve_order`) provides neither. See `DynValue`.

[dev-dependencies]
criterion = { workspace = true }

[features]
default = []
# Adds `Classifier::par_classify_batch`, a `rayon`-backed fan-out over the
# existing sequential `Classifier::classify`. See its doc comment in
# `src/basic/classifier.rs` for when to reach for it.
parallel = ["dep:rayon"]

[[bench]]
name = "classifiers"
harness = false

[lints]
workspace = true
