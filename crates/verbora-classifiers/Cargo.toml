[package]
name = "verbora-classifiers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Bayes, logistic regression and maximum entropy text classifiers for Rust"
keywords = ["classifier", "bayes", "maxent", "machine-learning"]
categories.workspace = true

[dependencies]
# `is_js_whitespace`, for `String.prototype.trim` and the BROWN corpus splitter.
verbora-core = { workspace = true }
# `tokenizeAndStem`, which is the classifiers' only contact with the rest of the
# library — and how they inherit the process-global stop-word list.
verbora-stemmers = { workspace = true }
rustc-hash = { workspace = true }
# `par_classify_batch`: data-parallel fan-out over `Classifier::classify`,
# gated behind the `parallel` feature. See its doc comment in
# `src/basic/classifier.rs` for when to reach for it.
rayon = { workspace = true, optional = true }

# Deliberately no `serde_json`: this crate needs a JSON reader whose float
# parsing is correctly rounded and whose objects keep document order, and
# `serde_json` (without `preserve_order`) provides neither. See `src/dynval.rs`.

[dev-dependencies]
criterion = { workspace = true }

[features]
default = []
# Adds `Classifier::par_classify_batch`, a `rayon`-backed fan-out over the
# existing sequential `Classifier::classify`. See its doc comment in
# `src/basic/classifier.rs` for when to reach for it.
parallel = ["dep:rayon"]

[[bench]]
name = "classifiers"
harness = false

[lints]
workspace = true
