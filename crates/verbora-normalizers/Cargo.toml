[package]
name = "verbora-normalizers"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Unicode normalization forms and diacritic folding for Rust"
keywords = ["normalization", "unicode", "nfc", "nfkc", "diacritics"]
categories.workspace = true

# docs.rs bakes one immutable page set per published version: a page built with
# the wrong flags cannot be re-rendered later, only republished under a new
# version. Build with every feature enabled, so feature-gated items and the doc
# links pointing at them resolve, and with `--cfg docsrs`, which is what makes
# the `#[cfg_attr(docsrs, doc(cfg(...)))]` feature badges render.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# UAX #15 is the whole crate. `unicode-normalization` supplies the four form
# iterators, the quick-check properties the `Cow::Borrowed` guarantee is
# decided with, and the `Canonical_Combining_Class` lookup `remove_diacritics`
# is defined over. A hand-frozen table is not an alternative here: normalization
# is defined by UCD properties, so a frozen table is simply wrong for every
# character encoded after the freeze
# (`docs/design/text-shaping-contract.md` §4.2).
unicode-normalization = { workspace = true }

# `par_remove_diacritics_batch`: data-parallel fan-out over
# `remove_diacritics`, gated behind the `parallel` feature. See that
# function's doc comment for when to reach for it.
rayon = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[features]
default = []
# Adds `par_remove_diacritics_batch`, a `rayon`-backed fan-out over the
# existing sequential `remove_diacritics`.
parallel = ["dep:rayon"]

[[bench]]
name = "normalizers"
harness = false

[lints]
workspace = true
