[package]
name = "verbora-tokenizers"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "UAX #29 word, segment and sentence tokenizers for Rust"
keywords = ["tokenizer", "nlp", "text", "unicode", "uax29"]
categories.workspace = true

# docs.rs bakes one immutable page set per published version: a page built with
# the wrong flags cannot be re-rendered later, only republished under a new
# version. Build with every feature enabled, so feature-gated items and the doc
# links pointing at them resolve, and with `--cfg docsrs`, which is what makes
# the `#[cfg_attr(docsrs, doc(cfg(...)))]` feature badges render.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
verbora-core = { workspace = true }
# UAX #29 word and sentence boundaries. See the crate documentation for why the
# Unicode version is a dependency rather than a frozen table.
unicode-segmentation = { workspace = true }
# `par_tokenize_batch`: a rayon fan-out over the sequential
# `BorrowingTokenizer::tokenize_borrowed`, gated behind the `parallel` feature.
rayon = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[features]
default = []
# Adds `par_tokenize_batch`, a `rayon`-backed fan-out over the existing
# sequential `BorrowingTokenizer::tokenize_borrowed`.
parallel = ["dep:rayon"]

[[bench]]
name = "tokenizers"
harness = false

[lints]
workspace = true
