[package]
name = "verbora-sentiment"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Multilingual lexicon-based sentiment analysis for Rust"
keywords = ["sentiment", "nlp", "afinn"]
categories.workspace = true

# docs.rs bakes one immutable page set per published version: a page built with
# the wrong flags cannot be re-rendered later, only republished under a new
# version. Build with every feature enabled, so feature-gated items and the doc
# links pointing at them resolve, and with `--cfg docsrs`, which is what makes
# the `#[cfg_attr(docsrs, doc(cfg(...)))]` feature badges render.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# `SentimentAnalyzer`'s optional second constructor argument is anything that
# can stem a word. This dependency exists so that `Stemmer` is implemented for
# every Verbora stemmer and the two crates compose without an adapter.
verbora-stemmers = { workspace = true }

# The vocabularies are up to 24,839 entries and every token costs one lookup.
# SipHash is the wrong default here: these keys are short, untrusted only in the
# sense that any text is, and never used to size an allocation.
rustc-hash = { workspace = true }

# A lexicon key is text, not a token: the tables spell entries `cover-up`,
# `bad luck` and `Abfall`. Keys are therefore indexed by the same UAX #29 word
# segmentation the caller's tokens come from, so the two can meet — see
# `Vocabulary`'s "lookup form". Without this the 14,273 keys this tokenizer
# cuts into two or more pieces are unreachable from any token stream.
verbora-tokenizers = { workspace = true }

# Deliberately no `serde_json`: the lexicons ship as `key \0 polarity \0`
# blobs, 1.2 MB of packed pairs instead of ~7.5 MB of source JSON, and need no
# parser at all.
#
# Deliberately no `verbora-core` dependency of its own: the one text operation
# this crate performs is the Unicode full lowercase mapping, which
# `str::to_lowercase` already implements exactly.

# Optional: batch-scores many independent documents against one shared
# analyzer, behind the `parallel` feature. Off by default so the common case
# — one document at a time, or a caller doing its own fan-out — pays nothing
# for a thread pool it does not use. See `src/parallel.rs`.
rayon = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "sentiment"
harness = false

[features]
default = []
# `SentimentAnalyzer::par_get_sentiment_batch` — see `src/parallel.rs` for why
# it exists and when to reach for it.
parallel = ["dep:rayon"]

[lints]
workspace = true
