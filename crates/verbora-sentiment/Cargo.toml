[package]
name = "verbora-sentiment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Multilingual lexicon-based sentiment analysis for Rust"
keywords = ["sentiment", "nlp", "afinn"]
categories.workspace = true

[dependencies]
# The reference's second constructor argument is any object with `.stem()`, and
# its own spec passes six different Porter variants. `Stemmer` is that contract;
# this dependency exists to implement it for the ported stemmers so the two
# crates compose without an adapter.
verbora-stemmers = { workspace = true }

# The vocabularies are up to 24,839 entries and every token costs one lookup.
# SipHash is the wrong default here: these keys are short, untrusted only in the
# sense that any text is, and never used to size an allocation.
rustc-hash = { workspace = true }

# Deliberately no `serde_json`: the lexicons ship as `key \0 polarity \0` blobs
# machine-dumped from the reference tables, which is 1.2 MB instead of the
# reference's 7.5 MB of JSON and needs no parser at all.
#
# Deliberately no `verbora-core`: nothing here splits or trims on `\s`, so
# `is_js_whitespace` has no call site. The only reference string semantics in
# play is `toLowerCase`, which `str::to_lowercase` already matches exactly.

# Optional: batch-scores many independent documents against one shared
# analyzer, behind the `parallel` feature. Off by default so the common case
# — one document at a time, or a caller doing its own fan-out — pays nothing
# for a thread pool it does not use. See `src/parallel.rs`.
rayon = { workspace = true, optional = true }

[dev-dependencies]
# Used only by the crate-level doctest that pipes a tokenizer into the analyzer,
# which is the composition the iterator-first API exists for.
verbora-tokenizers = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "sentiment"
harness = false

[features]
default = []
# `SentimentAnalyzer::par_get_sentiment_batch` — see `src/parallel.rs` for why
# it exists and when to reach for it.
parallel = ["dep:rayon"]

[lints]
workspace = true
