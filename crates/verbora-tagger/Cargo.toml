[package]
name = "verbora-tagger"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Brill part-of-speech tagger for Rust"
keywords = ["pos-tagger", "brill", "nlp"]
categories.workspace = true

[dependencies]
rustc-hash = { workspace = true }
rayon = { workspace = true, optional = true }

[build-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# `tests/tokenization.rs` measures the bundled lexicon keys against UAX #29 word
# segmentation — the tokenization `verbora_tokenizers::WordTokenizer` performs.
# Depending on the segmenter directly rather than on that crate keeps the test a
# measurement of the standard, not of a sibling crate's current behaviour.
unicode-segmentation = { workspace = true }

[features]
default = []
parallel = ["dep:rayon"]

[[bench]]
name = "tagger"
harness = false

[lints]
workspace = true
