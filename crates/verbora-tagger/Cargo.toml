[package]
name = "verbora-tagger"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Brill part-of-speech tagger engine for Rust — bring your own lexicon"
keywords = ["pos-tagger", "brill", "nlp"]
categories.workspace = true

# docs.rs bakes one immutable page set per published version: a page built with
# the wrong flags cannot be re-rendered later, only republished under a new
# version. Build with every feature enabled, so feature-gated items and the doc
# links pointing at them resolve, and with `--cfg docsrs`, which is what makes
# the `#[cfg_attr(docsrs, doc(cfg(...)))]` feature badges render.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rustc-hash = { workspace = true }
rayon = { workspace = true, optional = true }

[build-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# `tests/tokenization.rs` demonstrates the tokenizer coupling this crate's token
# contract creates, against UAX #29 word segmentation — the tokenization
# `verbora_tokenizers::WordTokenizer` performs. Depending on the segmenter
# directly rather than on that crate keeps the test a demonstration against the
# standard, not against a sibling crate's current behaviour.
unicode-segmentation = { workspace = true }

[features]
default = []
parallel = ["dep:rayon"]

[[bench]]
name = "tagger"
harness = false

[lints]
workspace = true
